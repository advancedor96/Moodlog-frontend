<div class="calendar-container">
    <p-dialog [modal]="true" [visible]="showModal()" position="center"  showHeader="false">
      <app-crud-modal #ohmygod (dataChanged)="onDataChanged()" (onClose)="showModal.set(false)"></app-crud-modal>
    </p-dialog>
  <!-- <app-crud-modal #ohmygod (dataChanged)="onDataChanged()"></app-crud-modal> -->
<div class="calendar">
  <!-- 標題 -->
  <div class="header">
    <button (click)="prevMonth()" class="nav-btn">←</button>
    <button type="button" class="logout-btn" (click)="logout()">Logout</button>
    <div class="fontsize_bar">
      <div type="button" (click)="minusFontSize()">-</div>
      <span class="font-size-label">{{ fontSize() }}px</span>
      <div type="button" (click)="addFontSize()">+</div>
    </div>

    <h2>{{ currentMonthYear() }}</h2>
    <button (click)="nextMonth()" class="nav-btn">→</button>
  </div>

  <!-- 星期標題（從星期一開始） -->
  <div class="weekdays">
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
    <div>Sun</div>
  </div>

  <!-- 日曆主體 -->
  <div class="days-grid">
    @for (date of calendarDays(); track $index) {

      @let entry = getEntryForDate(date);
      <div class="day-cell"
            (click)="onDateClick(date, entry)"
           [class.other-month]="!date || (date.getMonth() !== currentDate().getMonth())">

        @if (date && !entry) {
          <div class="date-number" >{{ date.getDate() }}</div>
        } @else if (date && entry) {
          <div class="date-number" [class.today]="isToday(date)"  [class.good]="entry.mood=='good'" [class.mid]="entry.mood==='mid'" [class.bad]="entry.mood=='bad'" >{{ date.getDate() }}

          </div>

            <div class="diary-content">
              <div class="content-text" [style.font-size.px]="fontSize()">
                {{ entry.content }}
              </div>
            </div>
        }
      </div>
    }
  </div>
</div>
</div>
