<div class="home">
  @if (errorMessage()){
    <h1>{{ errorMessage() }}</h1>
  }
  @if (isLoading()){
    <p-blockui [blocked]="isLoading()" class="xxx_blockui">
      <p-progress-spinner ariaLabel="loading" />
    </p-blockui>
  }@else {
    <app-month-calendar [entries]="logs()" (dataChanged)="loadData()"/>
  }
</div>
